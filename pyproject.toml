[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threeaction"
version = "0.1.0"
description = "Chow's rule vs interval-optimal three-action policies (CO3101)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
